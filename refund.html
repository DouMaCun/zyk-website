        <h1>退款售后说明</h1>
        <p>用户在无人售货柜购物过程中遇到扣款异常、商品识别异常、商品质量问题等情况，可申请售后处理。</p>
        <section>
          <h2>可处理情形</h2>
          <ul>
            <li>关门后订单扣款金额与实际拿取商品不一致。</li>
            <li>设备识别商品与实际拿取商品不一致。</li>
            <li>商品存在破损、临期或其他质量异常。</li>
          </ul>
        </section>
        <section>
          <h2>处理方式</h2>
          <p>平台核验订单记录、支付记录、开关门记录和商品识别记录后，可根据实际情况提供退款、补扣或其他合理处理方案。</p>
        </section>
        <section>
          <h2>处理时效</h2>
          <p>平台在收到完整售后信息后通常于 1-3 个工作日内处理。涉及支付渠道退款到账时间的，以支付渠道实际处理时间为准。</p>
        </section>
      </article>
